<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{inicio/inicio :: head}">

</head>

<body>

	<div class="container" th:replace="~{inicio/inicio :: inicio}">

	</div>
	<h2 style="text-align: center;">CONCEJALES</h2>
	<form th:action="@{/guardarConcejal}" th:object="${concejal}" method="post">
		<input type="hidden" th:field="*{id}">
		<div class="input-group container mt-4">
			<span class="input-group-text">NOMBRE Y APELLIDO</span>
			<input th:field="*{nombre}" type="text" aria-label="nombre" class="form-control" required>
			<input th:field="*{apellido}" type="text" aria-label="apellido" class="form-control" required>
		</div>
		<div class="input-group container mt-4">
			<span class="input-group-text">DNI</span>
			<input th:field="*{DNI}" type="text" aria-label="DNI" class="form-control" required>
		</div>
		<div class="input-group container mt-4">
			<span class="input-group-text">CORREO</span>
			<input th:field="*{correo}" type="email" aria-label="Correo" class="form-control" required>
		</div>
		<div class="input-group container mt-4">
			<span class="input-group-text">TELEFONO</span>
			<input th:field="*{telefono}" type="tel" aria-label="Telefono" class="form-control" required>
		</div>
		<div class="input-group container mt-4">
			<span class="input-group-text">CARGO</span>
			<select class="form-select" th:field="*{tipoRol}" required>
				<option value="">SELECCIONA UN CARGO</option>
				<option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.cargo}">
				</option>
			</select>
		</div>
		<div th:if="${mensajeExito}" class="alert alert-success m-3">
			<p th:text="${mensajeExito}"></p>
		</div>
		<div th:if="${mensajeError}" class="alert alert-danger m-3">
			<p th:text="${mensajeError}"></p>
		</div>
		<div class="container mt-3">

			<button type="submit" class="btn-outline theme-success">GUARDAR</button>
		</div>

	</form>

	<div class="container mt-5">
		<table class="table">
			<thead>
				<tr>
					<th scope="col">ID</th>
					<th scope="col">NOMBRE</th>
					<th scope="col">APELLIDO</th>
					<th scope="col">DNI</th>
					<th scope="col">CORREO</th>
					<th scope="col">TELEFONO</th>
					<th scope="col">ESTADO</th>
					<th scope="col">CARGO</th>
					<th scope="col">ACCIONES</th>
				</tr>
			</thead>
			<tbody class="table-group-divider">
				<tr th:each="d : ${Concejales}">
					<th scope="row" th:text="${d.id}"></th>
					<td th:text="${d.nombre}"></td>
					<td th:text="${d.apellido}"></td>
					<td th:text="${d.DNI}"></td>
					<td th:text="${d.correo}"></td>
					<td th:text="${d.telefono}"></td>
					<td th:if="${d.estado}">HABILITADO</td>
					<td th:unless="${d.estado}">INHABILITADO</td>
					<td th:text="${d.tipoRol.cargo}"></td>


					<td>
						<a th:href="@{/concejal/bajaConcejal(id=${d.id})}" class="btn btn-warning btn-sm"><i
								class="bi bi-check-circle"></i> / <i class="bi bi-dash-circle"></i></a>
						<a th:href="@{/modificar(id=${d.id})}" class="btn btn-danger">modificar</a>
					</td>
				</tr>
			</tbody>

		</table>
	</div>
</body>

</html>
