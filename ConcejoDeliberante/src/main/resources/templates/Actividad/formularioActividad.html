<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Alta Actividad</title>
</head>
<body>
	
	<div class="container" th:replace="~{inicio/inicio :: inicio}">
	    </div>


    <form th:action="@{/GuardarActividad}" th:object="${actividad}" method="post">
        <div class="input-group container mt-4">
            <span class="input-group-text">Fecha</span>
            <input  type="date" th:field="*{fecha}" aria-label="First name" class="form-control" required>
           
        </div>
		<div class="input-group container mt-4">
		           <span class="input-group-text">Hora Inicio</span>
		           <input  type="time" th:field="*{horaEntrada}" aria-label="First name" class="form-control" required>
		          
		       </div>
			   <div class="input-group container mt-4">
			              <span class="input-group-text">Hora Fin</span>
			              <input  type="time" th:field="*{horaSalida}" aria-label="First name" class="form-control" required>
			             
			          </div>
		<div class="container mt-3">
		  <button type="submit" class="btn btn-outline-success">GUARDAR</button>
		  </div>
    </form>
	<div class="container mt-5">
		        <table class="table">
		            <thead>
		                <tr>
		                    <th scope="col">ID</th>
		                    <th scope="col">FECHA</th>
							<th scope="col">HORA INICIO</th>
							<th scope="col">HORA FIN</th>
		                </tr>
		            </thead>
		            <tbody class="table-group-divider">
		               <tr th:each="a : ${actividades}">
		                    <td th:text="${a.id_actividad}"></td>
		                    <td th:text="${a.fecha}"></td>
							<td th:text="${a.horaEntrada}"></td>
							<td th:text="${a.horaSalida}"></td>
		            </tbody>
					
		        </table> 
		    </div>
</body>
</html>
