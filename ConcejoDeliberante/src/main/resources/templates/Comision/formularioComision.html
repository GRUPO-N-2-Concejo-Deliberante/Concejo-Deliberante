<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{inicio/inicio :: head}">

</head>

<body>
	<div class="container" th:replace="~{inicio/inicio :: inicio}">
	</div>

	<div class="pt-5">
		<form th:action="@{/guardarComision}" th:object="${comision}" method="post">
			<div class="input-group container mt-4">
				<span class="input-group-text">NOMBRE DE LA COMISION</span>
				<input type="text" th:field="*{nombre}" aria-label="First name" class="form-control" required>

			</div>
			<div class=" container  d-grid gap-2 mt-3">
				<button class="btn btn-outline-success" type="submit">GUARDAR</button>
			</div>
		</form>
	</div>
	<div class="container mt-5">
		<table class="table">
			<thead>
				<tr>
					<th scope="col">ID</th>
					<th scope="col">NOMBRE</th>
				</tr>
			</thead>
			<tbody class="table-group-divider">
				<tr th:each="t : ${comisiones}">
					<td th:text="${t.id}"></td>
					<td th:text="${t.nombre}"></td>
			</tbody>

		</table>
	</div>

</body>

</html>
