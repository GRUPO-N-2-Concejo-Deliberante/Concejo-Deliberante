<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{inicio/inicio :: head}">

</head>

<body>

	<div class="container" th:replace="~{inicio/inicio :: inicio}">
	</div>


	<div class="container pt-5">
		<form th:action="@{/guardarArchivo}" th:object="${archivo}" method="post">

			<div class="input-group container mt-4">
				<span class="input-group-text ">ASUNTO / TITULO</span>
				<input type="text" th:field="*{nombre}" aria-label="First name" class="form-control" required>
			</div>
			<div class="input-group container mt-4">
				<span class="input-group-text">ARCHIVO</span>
				<input type="file" th:field="*{archivoFisico}" enctype="multipart/form-data" aria-label="Last name"
					class="form-control" required>
			</div>
			<div class="input-group container mt-4">
				<span class="input-group-text">HORA DE REGISTRO</span>
				<input type="time" th:field="*{hora}" aria-label="First name" class="form-control" required>
			</div>

			<div class="input-group container mt-4">
				<span class="input-group-text">FECHA DE REGISTRO</span>
				<input type="date" th:field="*{fecha}" aria-label="First name" class="form-control" required>
			</div>
			<div class="input-group container mt-4">
				<span class="input-group-text">TIPO DE ARCHIVO</span>
				<select class="form-select" th:field="*{tipoArchivo}">
					<option value="">SELECIONA EL TIPO DE ARCHIVO</option>
					<option th:each="a : ${tipos}" th:value="${a.id}" th:text="${a.nombre}"></option>
				</select>
			</div>

			<div class="input-group container mt-4">
				<span class="input-group-text">CONCEJAL</span>
				<select class="form-select" th:field="*{concejal}" required>
					<option value="">SELECCIONA UN CONCEJAL</option>
					<option th:each="c : ${concejales}" th:value="${c.id}"
						th:text="${c.nombre + ' ' + c.apellido + ' - ' + c.DNI}">
					</option>
				</select>
			</div>


			<div class="input-group container mt-4">
				<span class="input-group-text">COMISION</span>
				<select class="form-select" th:field="*{comision}" aria-label="Selecciona una Comision perteneciente">
					<option value="">SELECCIONA UNA COMISION</option>
					<option th:each="co : ${comisiones}" th:value="${co.id}" th:text="${co.nombre}">
					</option>
				</select>
			</div>


			<div class=" container  d-grid gap-2 mt-3">
				<button class="btn btn-outline-success" type="submit">GUARDAR</button>
			</div>

			<div th:if="${SuccessMessage}" class="alert alert-success m-3">
				<p th:text="${SuccessMessage}"></p>
			</div>
			<div th:if="${WrongMessage}" class="alert alert-danger m-3">
				<p th:text="${WrongMessage}"></p>
			</div>
		</form>

	</div>

	<div class="container mt-5">
		<table class="table">
			<thead>
				<tr style="text-align: center;">
					<th scope="col">ID</th>
					<th scope="col">CONCEJAL</th>
					<th scope="col">ASUNTO</th>
					<th scope="col">TIPO</th>
					<th scope="col">COMISION</th>
					<th scope="col">HORA DE REGISTRO</th>
					<th scope="col">FECHA</th>
					<th scope="col">ESTADO</th>
					<th scope="col">ARCHIVO FISICO</th>
				</tr>
			</thead>
			<tbody class="table-group-divider">

				<tr th:each="a: ${archivos}" style="text-align: center;">

					<td th:text="${a.idArchivo}"></td>
					<td th:text="${a.concejal.nombre}"></td>
					<td th:text="${a.nombre}"></td>
					<td th:text="${a.tipoArchivo.nombre}"></td>
					<td th:text="${a.comision.nombre}"></td>
					<td th:text="${a.hora}"></td>
					<td th:text="${a.fecha}"></td>
					<td th:text="${a.estado}"></td>
					<td th:text="${a.archivoFisico}"></td>
				</tr>


			</tbody>
		</table>
	</div>
</body>

</html>
