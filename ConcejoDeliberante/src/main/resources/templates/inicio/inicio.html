<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous">
		</script>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<title>Document</title>

</head>
<body class="container"
	style="background-color:rgb(71, 0, 0); background-image:url('/img/LasLajitas.jpeg'); background-size:cover;">
	<nav th:fragment="inicio" class="navbar">
		<nav class="navbar bg-body-tertiary fixed-top">
			<div class="container-fluid">
				<a class="navbar-brand" th:href="@{/}">
					HONORABLE CONCEJO DELIBERANTE
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
					data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
					aria-labelledby="offcanvasNavbarLabel">
					<div class="offcanvas-header">
						<h5 class="offcanvas-title" id="offcanvasNavbarLabel">
							MENU
						</h5>
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close">
						</button>
					</div>
					<div class="offcanvas-body">
						<ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
							<li class="nav-item" sec:authorize="hasAnyAuthority('concejal','secretaria')">

								<a class="nav-link active" aria-current="page" th:href="@{/}">
									INICIO
								</a>

							</li>
							<li class="nav-item dropdown" sec:authorize="hasAuthority('secretaria')">

								<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
									aria-expanded="false">
									CONCEJALES
								</a>
								<ul class="dropdown-menu">
									<li>
										<a class="dropdown-item" th:href="@{/altaConcejal}">
											ALTA CONCEJALES
										</a>
									</li>
									<li>
										<hr class="dropdown-divider">
									</li>
									<li>
										<a class="dropdown-item" th:href="@{/altaRol}">
											ALTA ROL
										</a>
									</li>
									<li>
										<hr class="dropdown-divider">
									</li>
									<li>
										<a class="dropdown-item" th:href="@{/altaSecretaria}">
											ALTA SECRETARIA
										</a>
									</li>
								</ul>
							</li>

							
							<li class="nav-item dropdown" sec:authorize="hasAnyAuthority('concejal','secretaria')">

								<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
									aria-expanded="false">
									ARCHIVOS
								</a>
								<ul class="dropdown-menu">
									<li>
										<a class="dropdown-item" th:href="@{/altaArchivo}">
											ALTA DE ARCHIVOS
										</a>
									</li>
									<li sec:authorize="hasAuthority('secretaria')">
										<hr class="dropdown-divider">
									</li>

									<li sec:authorize="hasAuthority('secretaria')">
										<a class="dropdown-item" th:href="@{/altaTipo}">
											ALTA DE TIPO DE ARCHIVOS
										</a>
									</li>
									<li sec:authorize="hasAuthority('secretaria')">
										<hr class="dropdown-divider">
									</li>
									<li sec:authorize="hasAuthority('secretaria')">
										<a class="dropdown-item" th:href="@{/altaComision}">
											ALTA DE COMISIONES
										</a>
									</li>
								</ul>
							</li>

							<li class="nav-item dropdown" sec:authorize="hasAuthority('secretaria')">

								<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
									aria-expanded="false">
									ACTIVIDADES / SESIONES
								</a>
								<ul class="dropdown-menu">
									<li>
										<a class="dropdown-item" th:href="@{/AltaActividad}">
											ALTA DE ACTIVIDAD
										</a>
									</li>
									<li>
										<hr class="dropdown-divider">
									</li>
									<li>
										<a class="dropdown-item" th:href="@{/altaDetalle}">
											ORGANIZAR ORDEN DEL DIA
										</a>
									</li>
								</ul>
							</li>
							<li class="nav-item">
								<form th:action="@{/logout}" method="post">
									<button type="submit" class="nav-link">
										CERRAR SESIÓN
									</button>
								</form>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</nav>
</body>
</html>
