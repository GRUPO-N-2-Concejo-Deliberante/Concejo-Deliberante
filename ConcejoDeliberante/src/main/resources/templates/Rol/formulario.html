<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{inicio/inicio :: head}">

</head>

<body>

	<div class="container" th:replace="~{inicio/inicio :: inicio}">
	</div>


	<form th:action="@{/guardar}" th:object="${Rol}" method="post">
		<div class="input-group container mt-4">
			<span class="input-group-text">Cargo</span>
			<input type="text" th:field="*{cargo}" aria-label="First name" class="form-control" required>

		</div>
		<div class="container mt-3">
			<button type="submit" class="btn-outline theme-success">GUARDAR</button>
		</div>
	</form>
	<div class="container mt-5">
		<table class="table">
			<thead>
				<tr>
					<th scope="col">ID</th>
					<th scope="col">NOMBRE</th>
				</tr>
			</thead>
			<tbody class="table-group-divider">
				<tr th:each="t : ${roles}">
					<td th:text="${t.id}"></td>
					<td th:text="${t.cargo}"></td>
			</tbody>

		</table>
	</div>
</body>

</html>
